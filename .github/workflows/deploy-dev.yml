name: Deploy to dev.velvt.nl

# Ships a branch to the separate "velvet-dev" Cloud Run service behind
# dev.velvt.nl. Same image and same Cloud SQL *instance* as production, but
# its own database -- so anything you do here, including seeding or wiping,
# cannot reach a real member's account.
#
# Pushing to main deploys production (deploy-gcp.yml), not this. Every push
# to "development" lands here, and "Run workflow" deploys any other branch.
on:
  push:
    branches:
      - development
  workflow_dispatch: {}

env:
  REGION: ${{ vars.GCP_REGION || 'europe-west4' }}
  PROJECT: velvet-app-505108
  SERVICE: velvet-dev
  INSTANCE: velvet-db-eu

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/733528989325/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '733528989325-compute@developer.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Look up the Cloud SQL connection name
        id: sql
        run: |
          conn="$(gcloud sql instances describe "$INSTANCE" --project="$PROJECT" --format='value(connectionName)')"
          echo "conn_name=$conn" >> "$GITHUB_OUTPUT"

      # Deploying a reference to a secret that does not exist fails the whole
      # revision, so a half-finished mail setup must not be able to take dev
      # down with it.
      - name: Look for the Resend API key secret
        id: mail
        run: |
          if gcloud secrets describe velvet-resend-key --project="$PROJECT" >/dev/null 2>&1; then
            echo "resend=,RESEND_API_KEY=velvet-resend-key:latest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::velvet-resend-key not found -- deploying without it, so no mail will send."
            echo "resend=" >> "$GITHUB_OUTPUT"
          fi

      # ALLOW_BOT_MATCHES=1 is what makes dev usable by one person: without it
      # the seeded demo members are excluded from every search pool and a
      # search never pairs. It is exactly why this must not be production.
      #
      # SEARCH_INDEXING is left unset, so the app serves a disallow-all
      # robots.txt and X-Robots-Tag: noindex here. Do not set it.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT" \
            --source . \
            --region="$REGION" \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ steps.sql.outputs.conn_name }}" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ steps.sql.outputs.conn_name }},DB_USER=velvet_app,DB_NAME=velvet_dev,AUTO_LOGIN=0,FLASK_DEBUG=0,ALLOW_BOT_MATCHES=1,CANONICAL_HOST=dev.velvt.nl,MAIL_FROM=Velvt dev <noreply@velvt.nl>,SUPPORT_EMAIL=support@velvt.nl,MAIL_REPLY_TO=support@velvt.nl" \
            --set-secrets="DB_PASS=velvet-db-pass:latest,APP_SECRET_KEY=velvet-dev-secret-key:latest,APP_ADMIN_PASSWORD=velvet-dev-admin-pass:latest${{ steps.mail.outputs.resend }}" \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=80 \
            --startup-probe=httpGet.path=/healthz,periodSeconds=5,timeoutSeconds=5,failureThreshold=6
