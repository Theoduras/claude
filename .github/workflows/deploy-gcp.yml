name: Deploy to Cloud Run

# Ships the current code straight to the Velvet Cloud Run service described
# in docs/deploy-gcp.md. Runs on every push to this branch, or on demand.
on:
  push:
    branches:
      - claude/local-dev-workflow-plan-p8bfzv
  workflow_dispatch: {}

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: velvet
  INSTANCE: velvet-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Look up the Cloud SQL connection name
        id: sql
        run: |
          conn="$(gcloud sql instances describe "$INSTANCE" --format='value(connectionName)')"
          echo "conn_name=$conn" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region="$REGION" \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ steps.sql.outputs.conn_name }}" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ steps.sql.outputs.conn_name }},DB_USER=velvet_app,DB_NAME=velvet,AUTO_LOGIN=0,FLASK_DEBUG=0" \
            --set-secrets="DB_PASS=velvet-db-pass:latest,APP_SECRET_KEY=velvet-secret-key:latest,APP_ADMIN_PASSWORD=velvet-admin-pass:latest" \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80
