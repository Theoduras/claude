name: One-off admin grant (jeffrey.kluijtmans@gmail.com)

# Creates jeffrey.kluijtmans@gmail.com as an admin, or promotes it if the
# account already exists. Manual only. Modeled on seed-demo.yml: same OIDC
# auth, same Cloud SQL Auth Proxy, same "harmless default database" rule --
# an accidental dispatch touches velvet_dev, never production, unless
# `velvet` is chosen on purpose. The target address is fixed in this file
# rather than an input, so this workflow can only ever do the one thing its
# name says, not double as a general "make anyone admin" tool.
#
# One-off: delete this file once it has done its job.
on:
  workflow_dispatch:
    inputs:
      database:
        description: 'Which database'
        type: choice
        default: velvet_dev
        options: [velvet, velvet_dev]

env:
  PROJECT: velvet-app-505108
  INSTANCE_CONN: velvet-app-505108:europe-west4:velvet-db-eu
  TARGET_EMAIL: jeffrey.kluijtmans@gmail.com

jobs:
  grant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/733528989325/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '733528989325-compute@developer.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run over the Cloud SQL Auth Proxy
        run: |
          set -euo pipefail

          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "$INSTANCE_CONN" &

          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then break; fi
            sleep 1
          done

          DB_PASS="$(gcloud secrets versions access latest \
            --secret=velvet-db-pass --project="$PROJECT")"
          echo "::add-mask::$DB_PASS"

          python -m pip install -q psycopg[binary] werkzeug

          echo "Running against ${{ inputs.database || 'velvet_dev' }}"

          DATABASE_URL="postgresql://velvet_app:${DB_PASS}@127.0.0.1:5432/${{ inputs.database || 'velvet_dev' }}" \
            python - <<'PY'
          import os
          import secrets

          import psycopg
          from psycopg.rows import dict_row
          from werkzeug.security import generate_password_hash

          EMAIL = os.environ["TARGET_EMAIL"]

          with psycopg.connect(os.environ["DATABASE_URL"], row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT id, username FROM users WHERE LOWER(email) = LOWER(%s)",
                      (EMAIL,),
                  )
                  existing = cur.fetchone()

                  if existing:
                      cur.execute(
                          "UPDATE users SET is_admin = TRUE WHERE id = %s",
                          (existing["id"],),
                      )
                      print(f"PROMOTED existing account id={existing['id']} "
                            f"username={existing['username']!r} to admin")
                  else:
                      base = EMAIL.split("@")[0]
                      username = base
                      n = 0
                      while True:
                          cur.execute(
                              "SELECT 1 FROM users WHERE LOWER(username) = LOWER(%s)",
                              (username,),
                          )
                          if cur.fetchone() is None:
                              break
                          n += 1
                          username = f"{base}{n}"

                      password = secrets.token_urlsafe(18)
                      print(f"::add-mask::{password}")
                      cur.execute(
                          """
                          INSERT INTO users
                              (username, email, password_hash, is_admin,
                               status, email_verified_at)
                          VALUES (%s, %s, %s, TRUE, 'active', NOW())
                          RETURNING id
                          """,
                          (username, EMAIL, generate_password_hash(password)),
                      )
                      uid = cur.fetchone()["id"]
                      cur.execute(
                          "INSERT INTO profiles (user_id, name) VALUES (%s, 'Jeffrey')",
                          (uid,),
                      )
                      print(f"CREATED account id={uid} username={username!r}")
                      print(f"PASSWORD: {password}")

                  conn.commit()

                  cur.execute(
                      """
                      SELECT id, username, email, is_admin, status
                      FROM users WHERE LOWER(email) = LOWER(%s)
                      """,
                      (EMAIL,),
                  )
                  print("verify:", dict(cur.fetchone()))
          PY
