{% extends "base.html" %}
{% block title %}{{ t('admin.title') }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ t('admin.heading') }}</h1>
  <p class="subtitle">{{ t('admin.subtitle') }}</p>

  <form method="post" action="{{ url_for('admin_new_profile') }}">
    <label for="username">{{ t('admin.username') }}</label>
    <input id="username" name="username" type="text" minlength="3" required autofocus
           value="{{ profile['username'] or '' }}" placeholder="{{ t('admin.username_ph') }}">

    <label for="password">{{ t('admin.password') }}</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password"
           placeholder="{{ t('admin.password_ph') }}">
    <p class="hint">{{ t('admin.password_hint') }}</p>

    {% include "_profile_fields.html" %}
    <button class="btn" type="submit">{{ t('admin.submit') }}</button>
  </form>
</div>
{% endblock %}
