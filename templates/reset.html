{% extends "base.html" %}
{% block title %}Choose a new password — Velvt{% endblock %}
{% block content %}
<div class="card narrow">
  <p class="eyebrow">Velvt</p>
  <h1 style="margin-top: 0.5rem;">Choose a new password.</h1>
  <p class="subtitle" style="margin-bottom: 1.6rem;">
    Setting this signs you out everywhere else.
  </p>

  <form method="post" action="{{ url_for('reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="8" required autofocus>
    <p class="hint">At least 8 characters. Longer beats complicated.</p>

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password"
           minlength="8" required>

    <button class="btn btn-block" type="submit">Set password</button>
  </form>
</div>
{% endblock %}
