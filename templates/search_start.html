{% extends "base.html" %}
{% block title %}Live search — Velvet{% endblock %}
{% block content %}
<div class="card narrow">
  {% include "_search_steps.html" with context %}

  <h1 class="page-title--sm">What are you looking for?</h1>
  <p class="subtitle">Pick the kind of connection and where you're searching.</p>

  <form method="post" action="{{ url_for('live_search') }}" id="start-form">
    <div class="tile-grid">
      <label class="tile">
        <input type="radio" name="relationship_type" value="Long-term relationship" class="visually-hidden"
               {% if existing and existing['relationship_type'] == 'Long-term relationship' %}checked{% endif %} required>
        <span class="tile-face">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 20.2s-7.8-4.6-10-9.3C.4 7.4 2.6 4 6.2 4c2 0 3.7 1 4.8 2.6C12.1 5 13.8 4 15.8 4c3.6 0 5.8 3.4 4.2 6.9-2.2 4.7-10 9.3-10 9.3Z"
                  stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <strong>Long-term relationship</strong>
          {% if existing and existing['relationship_type'] == 'Long-term relationship' %}
            <span class="tile-tag">Your last search</span>
          {% endif %}
        </span>
      </label>

      <label class="tile">
        <input type="radio" name="relationship_type" value="Short-term relationship" class="visually-hidden"
               {% if existing and existing['relationship_type'] == 'Short-term relationship' %}checked{% endif %} required>
        <span class="tile-face">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21c4 0 6.5-2.6 6.5-6 0-2.7-1.6-4.3-2.6-5.9.1 1.7-.7 2.7-1.6 2.7-1.2 0-1.3-1.2-1.1-2.3.3-1.8-.4-3.9-2.2-5C10.6 6 10 8 8.6 9.6 7.4 11 6 12.4 6 15c0 3.4 2 6 6 6Z"
                  stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <strong>Short-term relationship</strong>
          {% if existing and existing['relationship_type'] == 'Short-term relationship' %}
            <span class="tile-tag">Your last search</span>
          {% endif %}
        </span>
      </label>

      <label class="tile">
        <input type="radio" name="relationship_type" value="Friendship" class="visually-hidden"
               {% if existing and existing['relationship_type'] == 'Friendship' %}checked{% endif %} required>
        <span class="tile-face">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="9.5" cy="12" r="6" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="14.5" cy="12" r="6" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <strong>Friendship</strong>
          {% if existing and existing['relationship_type'] == 'Friendship' %}
            <span class="tile-tag">Your last search</span>
          {% endif %}
        </span>
      </label>

      <label class="tile">
        <input type="radio" name="relationship_type" value="Not sure yet" class="visually-hidden"
               {% if existing and existing['relationship_type'] == 'Not sure yet' %}checked{% endif %} required>
        <span class="tile-face">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M9.6 9.4a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1 1-1 1.9"
                  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="16.7" r="0.15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <strong>Not sure yet</strong>
          {% if existing and existing['relationship_type'] == 'Not sure yet' %}
            <span class="tile-tag">Your last search</span>
          {% endif %}
        </span>
      </label>
    </div>

    <div class="where-block">
      <label for="location">Where you're searching</label>
      <div class="ac-wrap">
        <input id="location" name="location" type="text" autocomplete="off" list="city-list"
               value="{{ draft.get('location') if draft.get('location') else (existing['location'] if existing and existing['location'] else me['location']) }}"
               placeholder="e.g. Maastricht" role="combobox" aria-expanded="false"
               aria-controls="location-ac-list" aria-autocomplete="list">
        <ul class="ac-list" id="location-ac-list" role="listbox"></ul>
      </div>
      <datalist id="city-list">
        {% for city in city_choices %}<option value="{{ city }}"></option>{% endfor %}
      </datalist>
      <input type="hidden" name="location_lat" id="location_lat"
             value="{{ draft.get('location_lat') if draft.get('location_lat') else (existing['lat'] if existing and existing['lat'] is not none else '') }}">
      <input type="hidden" name="location_lng" id="location_lng"
             value="{{ draft.get('location_lng') if draft.get('location_lng') else (existing['lng'] if existing and existing['lng'] is not none else '') }}">

      <label for="radius_km">Search radius <span class="slider-value" id="radius-value"></span></label>
      <input type="range" id="radius_km" name="radius_km" min="5" max="{{ radius_max }}" step="5"
             value="{{ draft.get('radius_km') if draft.get('radius_km') else (existing['radius_km'] if existing else radius_max) }}">
      <p class="hint" id="radius-hint"></p>
    </div>

    <button class="btn btn-block" type="submit" name="mode" value="continue">Continue &rarr;</button>
    <button class="skip-link" type="submit" name="mode" value="skip">or just start searching</button>
  </form>
</div>

<style>
  .where-block { margin-top: 1.6rem; }
  .where-block > label:first-child { margin-top: 0; }
  #start-form > .btn { margin-top: 1.4rem; }
  /* A real escape hatch, not a peer of Continue -- text-sized and quiet,
     so screen 2 stays the primary path for anyone who doesn't press it. */
  .skip-link {
    display: block;
    width: 100%;
    margin-top: 0.7rem;
    padding: 0.4rem;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-align: center;
    cursor: pointer;
  }
  .skip-link:hover { color: var(--violet-crest); }
</style>

<script>
(function () {
  // ---- radius readout ----
  var radiusEl = document.getElementById("radius_km");
  var radiusOut = document.getElementById("radius-value");
  var radiusHint = document.getElementById("radius-hint");
  var radiusMax = parseInt(radiusEl.max, 10);

  function syncRadius() {
    var km = parseInt(radiusEl.value, 10);
    if (km >= radiusMax) {
      radiusOut.textContent = "anywhere";
      radiusHint.textContent = "Distance is ignored — match with anyone.";
    } else {
      radiusOut.textContent = km + " km";
      radiusHint.textContent = "Only people within " + km + " km of your location.";
    }
  }
  radiusEl.addEventListener("input", syncRadius);
  syncRadius();

  // ---- step dot 2 unlocks once a connection type is picked ----
  var dot2 = document.getElementById("step-dot-2");
  var form = document.getElementById("start-form");

  function syncDot() {
    var picked = form.querySelector('input[name="relationship_type"]:checked');
    if (!dot2) return;
    if (picked) {
      // Submitting is what carries the location and radius across, so the dot
      // posts the form rather than linking straight to the criteria screen.
      dot2.removeAttribute("aria-disabled");
      dot2.setAttribute("href", "#");
    } else {
      dot2.setAttribute("aria-disabled", "true");
    }
  }
  if (dot2) {
    dot2.addEventListener("click", function (ev) {
      ev.preventDefault();
      if (dot2.getAttribute("aria-disabled") !== "true") form.requestSubmit();
    });
  }
  form.querySelectorAll('input[name="relationship_type"]').forEach(function (r) {
    r.addEventListener("change", syncDot);
  });
  syncDot();

  // ---- location combobox (Photon suggestions via /api/places) ----
  var locInput = document.getElementById("location");
  var locList = document.getElementById("location-ac-list");
  var latEl = document.getElementById("location_lat");
  var lngEl = document.getElementById("location_lng");
  var acTimer = null;
  var acController = null;
  var acActive = -1;
  var acItems = [];

  function closeAc() {
    locList.innerHTML = "";
    acItems = [];
    acActive = -1;
    locInput.setAttribute("aria-expanded", "false");
  }

  function renderAc(results) {
    locList.innerHTML = "";
    acItems = results;
    acActive = -1;
    results.forEach(function (r, i) {
      var li = document.createElement("li");
      li.className = "ac-option";
      li.id = "ac-opt-" + i;
      li.setAttribute("role", "option");
      li.textContent = r.label;
      li.addEventListener("mousedown", function (ev) {
        ev.preventDefault();
        selectAc(i);
      });
      locList.appendChild(li);
    });
    locInput.setAttribute("aria-expanded", results.length ? "true" : "false");
  }

  function selectAc(i) {
    var r = acItems[i];
    if (!r) return;
    locInput.value = r.label;
    latEl.value = r.lat;
    lngEl.value = r.lng;
    closeAc();
  }

  locInput.addEventListener("input", function () {
    // A stale coordinate must never survive a re-type of the text.
    latEl.value = "";
    lngEl.value = "";
    var q = locInput.value.trim();
    clearTimeout(acTimer);
    if (q.length < 2) { closeAc(); return; }
    acTimer = setTimeout(function () {
      if (acController) acController.abort();
      acController = new AbortController();
      fetch("{{ url_for('api_places') }}?q=" + encodeURIComponent(q), {
        headers: { "Accept": "application/json" },
        signal: acController.signal
      })
        .then(function (res) { return res.json(); })
        .then(function (data) { renderAc(data.results || []); })
        .catch(function () { /* offline: free text still works */ });
    }, 250);
  });

  locInput.addEventListener("keydown", function (ev) {
    if (!acItems.length) return;
    if (ev.key === "ArrowDown") {
      ev.preventDefault();
      acActive = Math.min(acActive + 1, acItems.length - 1);
    } else if (ev.key === "ArrowUp") {
      ev.preventDefault();
      acActive = Math.max(acActive - 1, 0);
    } else if (ev.key === "Enter" && acActive >= 0) {
      ev.preventDefault();
      selectAc(acActive);
      return;
    } else if (ev.key === "Escape") {
      closeAc();
      return;
    } else {
      return;
    }
    Array.prototype.forEach.call(locList.children, function (li, i) {
      li.classList.toggle("active", i === acActive);
    });
    locInput.setAttribute("aria-activedescendant", "ac-opt-" + acActive);
  });

  locInput.addEventListener("blur", function () {
    setTimeout(closeAc, 120);
  });
})();
</script>
{% endblock %}
