{% extends "base.html" %}
{% block title %}Create account — Velvet{% endblock %}
{% block content %}
<div class="card narrow">
  <p class="eyebrow" style="margin-bottom:0.5rem;">Join Velvet</p>
  <h1 style="margin-bottom:0.4rem;">Make your entrance.</h1>
  <p class="subtitle" style="margin-bottom: 1.75rem;">
    Pick a name and password — your profile comes next.
  </p>

  <form method="post" action="{{ url_for('register') }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username"
           minlength="3" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="8" required>
    <p class="hint">At least 8 characters.</p>

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password"
           minlength="8" required>

    <button class="btn btn-block" type="submit">Create account</button>
  </form>

  <p class="hint" style="margin: 1.1rem 0 0; text-align: center;">
    Already a member? <a href="{{ url_for('login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
