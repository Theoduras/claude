{% extends "base.html" %}
{% block title %}Find a match — Velvet{% endblock %}
{% block content %}
<p class="eyebrow" style="margin-bottom:0.35rem;">Find</p>
<h1 style="margin-bottom:0.4rem;">Find a match</h1>
<p class="subtitle" style="margin-bottom:1.5rem;">What kind of connection are you looking for?</p>

<form method="post" action="{{ url_for('find') }}">
  <div class="grid" style="margin-bottom:1rem;">
    {% for rt in relationship_types %}
      <label class="choice {% if current_choice == rt %}choice-suggested{% endif %}">
        <input type="radio" name="relationship_type" value="{{ rt }}"
               {% if current_choice == rt %}checked{% endif %} required>
        <span>
          <strong>{{ rt }}</strong>
          {% if current_choice == rt %}
            <span class="muted" style="font-size:0.78rem;">from your profile</span>
          {% endif %}
        </span>
      </label>
    {% endfor %}
  </div>
  <button class="btn" type="submit">Show me matches &rarr;</button>
</form>
{% endblock %}
