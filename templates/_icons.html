{#- Every icon in the app, in one place.

  Before this file the 38 glyphs lived as 28 inline <svg> blocks across six
  templates, several of them an {% if %} chain with a branch per option. That
  made an icon unaddressable: there was no name to ask for, no list to choose
  from, and changing the stroke weight meant 28 edits that could silently
  disagree. search_start.html already pointed the way with a dict of path data
  keyed by relationship type -- this is that idea, for all of them.

  Two things are separated on purpose:

    ICONS  -- the drawings, keyed by what they are (a heart, a pin, a ruler).
    SLOTS  -- what the app puts where, keyed by the place (tab.search,
              pill.interest). A slot's value is a glyph name.

  Changing which icon a place uses is therefore a one-line change in SLOTS,
  and never a hunt through markup. The Restyler exports exactly that line.

  Stroke width and cap style stay on each drawing for now, which is why the
  same X mark appears three times at three weights -- close-sm (1.7),
  close (2) and photo-remove (2.4). The design system asks for one weight,
  2px on a 24 canvas with round caps and joins; when that lands these three
  collapse into one glyph.
-#}

{#- What sits where. The left side is a place in the app; the right side is a
    glyph above. An empty value draws nothing, which is how a pill carries no
    icon without the markup having to know that.

    The pill.* slots are the design system's chips: a chip carries an icon
    before its label, and --space-1 exists for exactly that gap. Set a glyph
    and every pill of that kind grows one; clear it and they all lose it.

    The home.* slots mostly point at the same glyphs the tab bar uses, but
    they are slots of their own so a card can be re-pointed from
    /admin/icons without the tab bar's glyph moving with it. -#}

{#- The design system's icon spec, chapter 07: outline, rounded caps and
    joins, 2px on a 24px canvas. The glyphs no longer carry these themselves --
    they used to run 1.6 to 2.4 with mixed joins, which is what a set of icons
    drifts into when each one states its own weight -- so changing the whole
    app's icon weight is these two lines and nothing else.

    STROKE is quoted at the spec's 24px canvas and scaled per glyph, because a
    few of them are drawn on a 20 or 21 box: 2px there would read heavier than
    2px here, which is the opposite of one weight. -#}
{%- set ICON_STROKE = 2 -%}
{%- set ICON_CAP = "round" -%}

{#- One <svg>, from a slot or straight from a glyph name.

    width/height are written out as the drawing's own canvas so an icon has an
    intrinsic size even where no CSS rule reaches it; every rule in velvt.css
    that sizes an icon still wins over the attribute. Stroke properties sit on
    the <svg> and the shapes inherit them, which is why stripping them from the
    drawings was enough. -#}
{%- macro icon(slot, cls="") -%}
  {#- An admin can re-point a slot at another glyph from /admin/icons. The
      override can only ever name something in ICONS, so the worst a bad row
      can do is draw nothing -- never inject markup. -#}
  {%- set name = icon_slot_override(slot) or SLOTS.get(slot, slot) -%}
  {%- set g = ICONS.get(name) -%}
  {%- if g -%}
    {%- set box = g[0].split(" ")[2] | float -%}
    <svg width="{{ box | int }}" height="{{ box | int }}" viewBox="{{ g[0] }}" fill="none"
         stroke-width="{{ (ICON_STROKE * box / 24) | round(2) }}"
         stroke-linecap="{{ ICON_CAP }}" stroke-linejoin="{{ ICON_CAP }}"
         aria-hidden="true"{% if cls %} class="{{ cls }}"{% endif %}>{{ g[1]|safe }}</svg>
  {%- endif -%}
{%- endmacro -%}
