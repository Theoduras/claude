# Render Blueprint for the Velvet dating demo.
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo/branch.
# See docs/deploy-render.md for the full walkthrough.
services:
  - type: web
    name: velvet-dating
    runtime: python
    plan: starter # paid tier — required for the persistent disk below.
    # Using "free" instead works, but Render's free web services spin down
    # after 15 min idle and wipe local disk on every restart/redeploy, so
    # dating.db resets constantly. Drop the whole `disk:` block (and the
    # DATABASE_PATH env var) if you go with "free" and accept that.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 4 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    disk:
      name: velvet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/dating.db
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_ADMIN_PASSWORD
        sync: false # set this in the Render dashboard after first deploy
      - key: AUTO_LOGIN
        value: "0"
      - key: FLASK_DEBUG
        value: "0"
